; Skin that Run.ps1 loads into the build under test. Its results are read back from the log.

[Rainmeter]
Update=250

[MeasureOsBits]
Measure=SysInfo
SysInfoType=OS_BITS

[MeasureCpu]
Measure=CPU

[MeasureMemory]
Measure=PhysicalMemory

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureCalc]
Measure=Calc
Formula=6 * 7

[MeasureScript]
Measure=Script
ScriptFile=SmokeTest.lua
Marker=ok

; An x86 DLL, which no ARM64 process can load. Rainmeter has to report that rather than crash.
[MeasureForeignPlugin]
Measure=Plugin
Plugin=NotArm64

[MeasureReport]
Measure=Calc
Formula=MeasureScript
IfCondition=MeasureScript = 42
IfTrueAction=[!Log "SMOKETEST measures os_bits=[MeasureOsBits] calc=[MeasureCalc] script=[MeasureScript]" Notice]

[MeterText]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureCpu
FontSize=11
FontColor=255,255,255,255
SolidColor=0,0,0,170
Padding=8,6,8,6
AntiAlias=1
Text=Rainmeter ARM64 smoke test - %1 - CPU %2%
