name: build-arm64

# Cross-compiles Rainmeter as a native Windows on ARM (ARM64) build on an x64 runner and packages
# it as a portable zip. The build job fails unless everything in the package is ARM64, without any
# x64 or ARM64EC code. A second job then starts the package on an ARM64 runner.

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'RainLexer/**'
      - '.github/workflows/*rainlexer*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: BuildOut\ReleaseARM64
  PACKAGE_NAME: Rainmeter-ARM64-Portable

jobs:
  rainmeter-arm64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up MSVC ARM64 build tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          # The x64-hosted compiler that targets ARM64. Plain "arm64" sets up a native ARM64
          # environment instead, whose ARM64-hosted cl.exe and dumpbin.exe this x64 runner lacks.
          arch: amd64_arm64

      - name: Write version header
        shell: pwsh
        run: |
          # Mirrors the Version.h that Build\Build.ps1 writes for upstream's own CI builds.
          $now = (Get-Date).ToUniversalTime()
          $revision = [int]$env:GITHUB_RUN_NUMBER
          $versionShort = '{0}.{1}.{2}' -f $now.Year, $now.Month, $now.Day
          $versionFull = "$versionShort.$revision"
          $lines = @(
            '#pragma once',
            "#define FILEVER $($now.Year),$($now.Month),$($now.Day),$revision",
            '#define PRODUCTVER FILEVER',
            "#define STRFILEVER `"$versionFull`"",
            '#define STRPRODUCTVER STRFILEVER',
            "#define APPVERSION L`"$versionShort`"",
            "#define RAINMETER_VERSION (($($now.Year) * 1000000) + ($($now.Month) * 1000) + $($now.Day))",
            "#define BUILD_TIME L`"$($now.ToString('yyyy-MM-dd HH:mm:ss'))`"",
            "#define STRCOPYRIGHT `"\xA9 $($now.Year) Rainmeter Team`"",
            "const int revision_number = $revision;",
            "#define COMMIT_HASH L`"$env:GITHUB_SHA`"",
            '#define UNOFFICIAL_BUILD'
          )
          $path = Join-Path $env:GITHUB_WORKSPACE 'Version.h'
          [IO.File]::WriteAllText($path, ($lines -join "`r`n") + "`r`n", [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $path
          "RAINMETER_VERSION=$versionFull" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rainmeter (Release|ARM64)
        shell: pwsh
        run: MSBuild.exe Rainmeter.sln /p:Configuration=Release /p:Platform=ARM64 /p:ExcludeTests=true /m /nologo /v:minimal

      - name: Generate language files
        shell: pwsh
        run: |
          $languages = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR\Languages"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build\GenerateLanguages.ps1 -OutputDirectory $languages -RuntimeOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable build
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $build = Join-Path $root $env:BUILD_DIR
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_NAME
          $zip = Join-Path $root "$env:PACKAGE_NAME.zip"

          Remove-Item -LiteralPath $stage, $zip -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          # The same layout as an installation made by the official installer.
          Copy-Item -LiteralPath (Join-Path $build 'Rainmeter.exe'), (Join-Path $build 'Rainmeter.dll'), (Join-Path $build 'SkinInstaller.exe') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $root 'Application\Rainmeter.exe.config') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $build 'Languages') -Destination $stage -Recurse
          New-Item -ItemType Directory -Path (Join-Path $stage 'Defaults') | Out-Null
          Copy-Item -LiteralPath (Join-Path $root 'Build\Skins') -Destination (Join-Path $stage 'Defaults\Skins') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'Build\Layouts') -Destination (Join-Path $stage 'Defaults\Layouts') -Recurse

          # Measures that used to be plugins are built into Rainmeter.dll, so the build has no
          # plugin DLLs of its own. Should it ever produce a Plugins folder, that is included.
          $plugins = Join-Path $build 'Plugins'
          if (Test-Path -LiteralPath $plugins -PathType Container) {
            Copy-Item -LiteralPath $plugins -Destination $stage -Recurse
          }

          # Rainmeter runs as a portable installation (settings, skins and layouts are all kept
          # next to Rainmeter.exe) whenever a Rainmeter.ini exists in its own folder. That is what
          # the official installer writes for a portable install: the default layout. "Portable=1"
          # is only a marker for people reading the file; Rainmeter does not look at it.
          $settings = [Collections.Generic.List[string]][IO.File]::ReadAllLines((Join-Path $root 'Build\Layouts\illustro default\Rainmeter.ini'))
          $section = $settings.IndexOf('[Rainmeter]')
          if ($section -lt 0) { throw 'The default layout has no [Rainmeter] section.' }
          $settings.Insert($section + 1, 'Portable=1')
          [IO.File]::WriteAllLines((Join-Path $stage 'Rainmeter.ini'), $settings, [Text.Encoding]::Unicode)

          Copy-Item -LiteralPath (Join-Path $root 'LICENSE') -Destination (Join-Path $stage 'LICENSE.txt')
          $readme = @(
            "Rainmeter $env:RAINMETER_VERSION for Windows on ARM (native ARM64), portable",
            '',
            'This is an unofficial build. It is not made or supported by the Rainmeter team.',
            "Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA",
            '',
            'Extract the archive to a folder you can write to and run Rainmeter.exe. Settings, skins',
            'and layouts are kept in that folder, because it contains Rainmeter.ini.',
            '',
            'Plugins: a native ARM64 process cannot load x64 DLLs, so third-party plugins made for',
            'the regular (x64) Rainmeter do not load in this build. Skins that only use the built-in',
            'measures are not affected. Plugins compiled for ARM64 go into the Plugins folder.'
          )
          [IO.File]::WriteAllLines((Join-Path $stage 'README-ARM64.txt'), $readme, [Text.UTF8Encoding]::new($false))

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          Get-Item -LiteralPath $zip | Format-List Name, Length

      - name: Verify package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_NAME.zip"
          $package = Join-Path $env:RUNNER_TEMP 'verify-package'
          Remove-Item -LiteralPath $package -Recurse -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $package)

          $failures = [Collections.Generic.List[string]]::new()

          $expected = @(
            'Rainmeter.exe',
            'Rainmeter.dll',
            'SkinInstaller.exe',
            'Rainmeter.exe.config',
            'Rainmeter.ini',
            'Languages\1033.rmlang',
            'Defaults\Skins\illustro\Welcome\Welcome.ini',
            'Defaults\Layouts\illustro default\Rainmeter.ini'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $file) -PathType Leaf)) {
              $failures.Add("Missing from package: $file")
            }
          }

          $settings = [IO.File]::ReadAllLines((Join-Path $package 'Rainmeter.ini'))
          if ($settings -notcontains 'Portable=1') {
            $failures.Add('Rainmeter.ini does not contain Portable=1')
          }

          $binaries = @(Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          if ($binaries.Count -lt 3) {
            $failures.Add("Expected at least 3 binaries in the package, found $($binaries.Count)")
          }

          $summary = @('| File | Machine | Size |', '| --- | --- | ---: |')
          foreach ($binary in $binaries) {
            $name = $binary.FullName.Substring($package.Length + 1)

            $headers = & dumpbin.exe /nologo /headers $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed for $name" }
            $machine = ($headers | Select-String -Pattern '^\s*[0-9A-Fa-f]+ machine \(.*$' | Select-Object -First 1).Line
            $machine = if ($machine) { $machine.Trim() } else { '<none>' }
            Write-Host ('{0,-24} {1}' -f $name, $machine)
            $summary += "| ``$name`` | $machine | $('{0:N0}' -f $binary.Length) |"

            # ARM64EC and ARM64X binaries also run on ARM64, but still carry x64 code.
            if ($machine -ne 'AA64 machine (ARM64)') {
              $failures.Add("$name is not a native ARM64 binary: $machine")
            }

            $productVersion = $binary.VersionInfo.ProductVersion
            if ($productVersion -notlike "$env:RAINMETER_VERSION (ARM64)") {
              $failures.Add("$name has product version '$productVersion' instead of '$env:RAINMETER_VERSION (ARM64)'")
            }

            # A portable build must not need the Visual C++ redistributable.
            $dependents = & dumpbin.exe /nologo /dependents $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed for $name" }
            $runtime = @($dependents | Where-Object { $_ -match '(?i)\b(?:MSVCP|VCRUNTIME)[^\s]*\.dll\b' } | ForEach-Object { $_.Trim() })
            if ($runtime.Count -gt 0) {
              $failures.Add("$name depends on the Visual C++ runtime: $($runtime -join ', ')")
            }
          }

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $summary = @(
            "### $env:PACKAGE_NAME.zip",
            '',
            "Rainmeter $env:RAINMETER_VERSION, commit ``$env:GITHUB_SHA``",
            '',
            "SHA-256: ``$hash``",
            ''
          ) + $summary
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "::error title=Package verification::$failure" }
            exit 1
          }
          Write-Host "All $($binaries.Count) binaries are native ARM64."

      - name: Upload portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.PACKAGE_NAME }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-DebugSymbols
          path: BuildOut/ReleaseARM64/**/*.pdb
          if-no-files-found: error

  smoke-test:
    needs: rainmeter-arm64
    # Starts the package on GitHub's hosted ARM64 runner. That runner is free for public
    # repositories but may not be available to private ones, where the job would otherwise wait
    # for a runner that never comes.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download portable build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}.zip
          path: package
          # Keep the zip as it was uploaded, so that the test starts from the file people download.
          skip-decompress: true

      - name: Run Rainmeter
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package\$env:PACKAGE_NAME.zip"
          .\.github\smoke-test\Run.ps1 -Package $package -WorkDirectory (Join-Path $env:RUNNER_TEMP 'smoke-test')

      - name: Upload log and screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-SmokeTest
          path: ${{ runner.temp }}/smoke-test/Results
          if-no-files-found: warn
